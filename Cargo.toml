[package]
name = "keep-audio-alive"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "keep-audio-alive"
path = "src/main.rs"

[dependencies]
trayicon = "0.4"
winit = "0.30"
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
winreg = "0.56"

[profile.release]
opt-level = "z"
lto = true
strip = true
